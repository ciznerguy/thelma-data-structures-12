e (p.HasNext())\n    {\n        p = p.GetNext();\n    }\n    p.SetNext(n);\n    return head;\n}\n\nNode<int> head = null;\nhead = AddLast(head, 7);\nhead = AddLast(head, 8);\nConsole.WriteLine(head);", "right": "7,8,", "wrongs": ["8,7,", "7,", "7,8"], "why": "בשרשרת ריקה החוליה החדשה היא הראש, ואחר כך מוסיפים בסוף."}, {"topic": 3, "text": "למה פעולה שמוסיפה חוליה בראש שרשרת צריכה להחזיר את הראש החדש?", "code": null, "right": "כי השינוי של הפרמטר אינו משפיע על המשתנה של מי שקרא לפעולה", "wrongs": ["כי אי אפשר להוסיף חוליה בלי להחזיר ערך", "כי הראש הישן נמחק", "כי הפעולה תמיד יוצרת שרשרת חדשה"], "why": "הפרמטר הוא עותק של ההפניה, ולכן המשתנה של הקורא נשאר מצביע על הראש הישן."}, {"topic": 4, "text": "מה יודפס?", "code": "static Node<int> Remove(Node<int> head, int value)\n{\n    if (head == null)\n    {\n        return null;\n    }\n    if (head.GetValue() == value)\n    {\n        return head.GetNext();\n    }\n    Node<int> p = head;\n    while (p.HasNext() && p.GetNext().GetValue() != value)\n    {\n        p = p.GetNext();\n    }\n    if (p.HasNext())\n    {\n        p.SetNext(p.GetNext().GetNext());\n    }\n    return head;\n}\n\nNode<int> head = new Node<int>(1, new Node<int>(2, new Node<int>(3)));\nhead = Remove(head, 2);\nConsole.WriteLine(head);", "right": "1,3,", "wrongs": ["1,2,", "2,3,", "1,2,3,"], "why": "החוליה שלפני 2 מדלגת עליה ומצביעה על 3."}, {"topic": 4, "text": "מה יודפס?", "code": "static Node<int> Remove(Node<int> head, int value)\n{\n    if (head == null)\n    {\n        return null;\n    }\n    if (head.GetValue() == value)\n    {\n        return head.GetNext();\n    }\n    Node<int> p = head;\n    while (p.HasNext() && p.GetNext().GetValue() != value)\n    {\n        p = p.GetNext();\n    }\n    if (p.HasNext())\n    {\n        p.SetNext(p.GetNext().GetNext());\n    }\n    return head;\n}\n\nNode<int> head = new Node<int>(1, new Node<int>(2, new Node<int>(3)));\nhead = Remove(head, 1);\nConsole.WriteLine(head);", "right": "2,3,", "wrongs": ["1,
