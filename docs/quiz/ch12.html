n}\ninterface ISwimmer\n{\n    string Swim();\n}\nclass Duck : IFlyable, ISwimmer\n{\n    public string Fly()\n    {\n        return \"low\";\n    }\n    public string Swim()\n    {\n        return \"paddle\";\n    }\n}\n\nDuck d = new Duck();\nConsole.WriteLine(d.Fly() + \" \" + d.Swim());", "right": "low paddle", "wrongs": ["flap paddle", "low low", "paddle low"], "why": "הברווז מממש שני ממשקים, ולכן יש לו את הפעולות של שניהם."}, {"topic": 2, "text": "מה מותר במחלקה אחת?", "code": null, "right": "לרשת ממחלקה אחת ולממש כמה ממשקים", "wrongs": ["לרשת מכמה מחלקות ולממש ממשק אחד", "לרשת מכמה מחלקות ולממש כמה ממשקים", "לממש ממשק אחד בלבד ולא לרשת"], "why": "לכן ממשקים מאפשרים לשלב כמה יכולות."}, {"topic": 2, "text": "מה יודפס?", "code": "interface IBase\n{\n    string A();\n}\ninterface IChild : IBase\n{\n    string B();\n}\nclass Impl : IChild\n{\n    public string A()\n    {\n        return \"a\";\n    }\n    public string B()\n    {\n        return \"b\";\n    }\n}\n\nIBase x = new Impl();\nIChild y = new Impl();\nConsole.WriteLine(x.A() + y.A() + y.B());", "right": "aab", "wrongs": ["ab", "abb", "a"], "why": "הממשק היורש מכיל את הפעולות של שני הממשקים, ולכן המחלקה מממשת את שתי הפעולות."}, {"topic": 3, "text": "מה יודפס?", "code": "interface IFlyable\n{\n    string Fly();\n}\ninterface ISwimmer\n{\n    string Swim();\n}\nclass Bird : IFlyable\n{\n    public string Fly()\n    {\n        return \"flap\";\n    }\n}\nclass Plane : IFlyable\n{\n    public string Fly()\n    {\n        return \"engine\";\n    }\n}\nclass Duck : IFlyable, ISwimmer\n{\n    public string Fly()\n    {\n        return \"low\";\n    }\n    public string Swim()\n    {\n        return \"paddle\";\n    }\n}\n\nIFlyable[] items = new IFlyable[3];\nitems[0] = new Bird();\nitems[1] = new Plane();\nitems[2] = new Duck();\nfor (int i = 0; i < items.Length; i++)\n{\n    Console.Write(items[i].Fly() + \" \");\n}", "right": "flap engine low", "wrongs": ["flap flap flap", "low engine flap", "flap engine paddle"], "why": "מחלקות שונות לגמרי יכולות להיות באותו מערך, כי כולן מממשות את הממשק."}, {"topic": 3, "text": "מה יודפס?", "code": "interface IScorable\n{\n    string GetName();\n    int GetScore();\n}\nclass Student : IScorable\n{\n    private string name;\n    private int grade;\n    public Student(string name, int grade)\n    {\n        this.name = name;\n        this.grade = grade;\n    }\n    public string GetName()\n    {\n        return this.name;\n    }\n    public int GetScore()\n    {\n        return this.grade;\n    }\n}\nclass Team : IScorable\n{\n    private string name;\n    private int wins;\n    public Team(string name, int wins)\n    {\n        this.name = name;\n        this.wins = wins;\n    }\n    public string GetName()\n    {\n        return this.name;\n    }\n    public int GetScore()\n    {\n        return this.wins * 3;\n    }\n}\nstatic IScorable Best(IScorable[] items)\n{\n    IScorable best = items[0];\n    for (int i = 1; i < items.Length; i++)\n    {\n        if (items[i].GetScore() > best.GetScore())\n        {\n            best = items[i];\n        }\n    }\n    return best;\n}\n\nIScorable[] items = new IScorable[3];\nitems[0] = new Student(\"Dana\", 90);\nitems[1] = new Team(\"Reds\", 5);\nitems[2] = new Student(\"Avi\", 75);\nConsole.WriteLine(Best(items).GetName());", "right": "Dana", "wrongs": ["Reds", "Avi", "Team"], "why": "הציון של הקבוצה Reds הוא 15, ושל התלמידים 90 ו-75. הציון הגבוה ביותר הוא של Dana."}, {"topic": 3, "text": "מה אפשר להציב במשתנה מסוג ממשק?", "code": null, "right": "עצם של כל מחלקה שמממשת את הממשק", "wrongs": ["רק עצם של מחלקה אחת", "רק מספרים", "שום דבר"], "why": "זה פולימורפיזם בעזרת ממשק."}, {"topic": 4, "text": "מה ההבדל העיקרי בין ממשק למחלקה מופשטת?", "code": null, "right": "ממשק מגדיר יכולת בלי מימוש, ומחלקה מופשטת יכולה לכלול תכונות ופעולות עם גוף", "wrongs": ["אין הבדל", "ממשק יכול לכלול תכונות, ומחלקה מופשטת לא", "מחלקה מופשטת היא ממשק שאין לו שם"], "why": "גם ממשקים וגם מחלקות מופשטות אי אפשר ליצור מ
